<body>
  <h1>index.xhtml deployment experiment</h1>
  <p>This artifact contains exactly one file: <code>index.xhtml</code>.</p>
  <p>If this page is served at the site root (<code>/legal-theory/</code>), GitHub Pages resolves
     <code>index.xhtml</code> as a directory index. If the root returns 404 while
     <code>/legal-theory/index.xhtml</code> serves this page directly, it does not.</p>
</body>
