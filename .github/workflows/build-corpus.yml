name: Validate & Build DocBook Corpus

on:
  push:
    branches:
      - main
      - claude/llm-database-theory-codification
      - claude/llm-database-theory-codification-sdd-1785019559
    paths:
      - 'docs/**/*.xml'
      - 'docs/xsl/**'
  pull_request:
    branches: [main, claude/llm-database-theory-codification]
    paths:
      - 'docs/**/*.xml'
      - 'docs/xsl/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DocBook toolchain
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils xsltproc jing docbook-xsl-ns

      - name: Validate and rebuild corpus HTML
        run: |
          set -euo pipefail
          mkdir -p .cache/docbook-5.2
          test -f .cache/docbook-5.2/docbookxi.rnc || \
            curl -fsSL -o .cache/docbook-5.2/docbookxi.rnc \
              https://docs.oasis-open.org/docbook/docbook/v5.2/os/rng/docbookxi.rnc
          while IFS= read -r xml; do
            root_element="$(xmllint --xpath 'name(/*)' "$xml" 2>/dev/null || true)"
            root_ns="$(xmllint --xpath 'namespace-uri(/*)' "$xml" 2>/dev/null || true)"

            # Which of this corpus's actual root-element shapes this loop
            # validates, and how -- see scripts/check_docbook_grammar.py's
            # module docstring for the full research trail. "article" is
            # every shell document (gets the article-only dcterms check
            # and HTML build too). "section"/"info"/"legalnotice" are
            # XIncluded fragment/metadata/boilerplate content that DocBook
            # 5.2's own RNG grammar DOES export as a standalone start
            # pattern -- validated, but not dcterms-checked (that policy
            # is <article><info> shaped) or built to HTML (only shells are
            # reader-facing pages). Anything else -- "biblioentry"/
            # "authorgroup" (real DocBook content this grammar does NOT
            # export a standalone start pattern for; only ever validated
            # in context, via the shell that XIncludes it) or a non-
            # DocBook root entirely (docs/sitemap.xml's "urlset") -- is
            # correctly out of scope and left alone, same as before.
            case "$root_ns:$root_element" in
              "http://docbook.org/ns/docbook:article")
                is_article=1 ;;
              "http://docbook.org/ns/docbook:section" | "http://docbook.org/ns/docbook:info" | "http://docbook.org/ns/docbook:legalnotice")
                is_article=0 ;;
              *)
                continue ;;
            esac

            echo "== $xml =="
            xmllint --noout --xinclude "$xml"
            python3 scripts/check_docbook_grammar.py "$xml"
            if [ "$is_article" = "1" ]; then
              python3 scripts/check_dcterms_completeness.py "$xml"
              xsltproc --xinclude --stringparam docbook.css.source '' /usr/share/xml/docbook/stylesheet/docbook-xsl-ns/xhtml5/docbook.xsl "$xml" > "${xml%.xml}.html"
            fi
          done < <(find docs -name '*.xml' -not -path '*/scratch/*' | sort)

      # pull_request events check out a detached, synthetic merge ref (not
      # the PR's actual branch) -- there is nothing sensible to push to, and
      # committing mid-review would be surprising. Publishing the rebuilt
      # HTML stays a push-to-main/claude/llm-database-theory-codification-only
      # concern; pull_request runs only validate.
      - name: Commit rebuilt HTML if changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          # No [skip ci]: a rebuild here means committed HTML drifted from its
          # XML source, and Deploy Pages (no path filter) must pick up the fix.
          git diff --cached --quiet || git commit -m "chore: rebuild corpus HTML"
          git push
